# Each invocation captures and selects a new object; no object-specific targets.
base_config: src/ada_grasp_ctrl/config/experiments/grasp_pipeline.yaml
environment: hardware
robot_snapshot: output/dual_arm/phase1_20261111/commit_snapshot
# Fresh table-only fit; camera extrinsics remain unchanged. See this run's calibration_review.json.
table_plane: output/fixed_camera/table_recalibration_20261123T215945_898848Z/fit/table_plane.json
enabled_arms: [left, right]
# Preserve endpoint height/orientation; allow up to 10 cm horizontally toward
# the active base after vertical IK fails. Zero restores strict vertical targets.
endpoint_inward_offset_m: 0.1
# Explicit example preference, used only with --selector hierarchical; not a learned prior.
# left_full labels mirrored right_full output, not an independently trained model.
hierarchical_selector:
  prior:
    schema_version: 1
    kind: ranking
    ranking: [right_full, left_full]
  supported_modes: [right_full, left_full]
mirroring:
  plane_normal_world: [0, 1, 0]
  plane_point: object_point_cloud_centroid

# Native Auto-Mode deployment; sampling settings come from this run's Hydra config.
grasp_models:
  native_multimode:
    checkpoint: /home/hao-fang/hugs-workspace/HUGS-DexLearn/output/sharpaDualMulti_robotMultiHierar_native_sharpa_all5_50k_v1/ckpts/step_200000.pth
    training_config: /home/hao-fang/hugs-workspace/HUGS-DexLearn/output/sharpaDualMulti_robotMultiHierar_native_sharpa_all5_50k_v1/.hydra/config.yaml
    metadata_root: /home/hao-fang/hugs-workspace/HUGS-DexLearn/pilots/dual_sharpa_phase4_v1/dataset/sharpa_dual

# Model references only; no captured object, ROI or candidate is reused.
inference_model:
  checkpoint:
    path: /home/hao-fang/hugs-dataset/BimanBODex_sharpa_1264k_v1/dexlearn_training/sharpaMulti_robotMultiHierar_sharpa_right_full_1m_100k_v1/ckpts/step_100000.pth
    sha256: 92fc78e580753a3659116e867e075e91d75a342176abd2434b9d98828b3083d6
  training_config:
    path: /home/hao-fang/hugs-dataset/BimanBODex_sharpa_1264k_v1/dexlearn_training/sharpaMulti_robotMultiHierar_sharpa_right_full_1m_100k_v1/.hydra/config.yaml
    sha256: 194f740dc401582afb151505083e77a32318ab7b8d38e42710ea6e05f2165dbb
  metadata:
    path: /home/hao-fang/hugs-dataset/BimanBODex_sharpa_1264k_v1/sharpa_right/right_full/metadata.json
    sha256: 284f272d6355f002cbaf3421c2b74ba18a7b986ba8a6ffeb37e738b13629f42e

# Interactive MuJoCo only; shared hardware targets and receiver policies are unchanged.
simulation:
  contact_profile: dexgraspbench
  reference_hz: 25
  squeeze_extrapolate_ratio: 2.0
  stage_completion: timed
  # Historical single-arm benchmark environment: no global gravity, object force = mass * -10 N/kg.
  gravity_mode: object_only
  # Complete the source-oriented lift before Reorient, then Transport and Place.
  placement_lift_height_m: 0.15
  # Winner-only stages; Reorient/Transport/Place reuse the shared duration policy.
  placement:
    preplace_height_m: 0.15
    settle_s: 0.5
    release_1_s: 0.5
    release_2_s: 1.0
    # Open fingers first, then lift along the upward table normal before withdrawing.
    retreat_lift_height_m: 0.10
    retreat_lift_s: 2.0
    retreat_distance_m: 0.10
    retreat_s: 2.0
