# Experimental passive PointCloud2 input. Distances are meters, world up is +Z.
serial: '347322060270'
camera_node: /camera/fixed
cloud_topic: /camera/fixed/depth/color/points
rgb_topic: /camera/fixed/color/image_raw
color_info_topic: /camera/fixed/color/camera_info
depth_info_topic: /camera/fixed/depth/camera_info
world_frame: world
color_frame: fixed_color_optical_frame
max_age_s: 0.5
sync_tolerance_s: 0.05
capture_timeout_s: 20.0
min_depth_m: 0.15
max_depth_m: 2.0
min_points: 300
min_valid_fraction: 0.25
ransac_threshold_m: 0.006
ransac_iterations: 400
ransac_max_points: 12000
seed: 4
min_inlier_ratio: 0.65
min_span_m: 0.12
max_rms_m: 0.004
max_p95_m: 0.008
max_residual_m: 0.012
max_tilt_deg: 20.0
height_range_m: [-0.5, 1.5]
horizontal_tolerance_deg: 2.0
object_min_height_m: 0.015
object_max_height_m: 0.5
object_voxel_m: 0.004
object_cluster_radius_m: 0.015
object_min_points: 100
reference_tolerance_m: 0.015
repeat_height_tolerance_m: 0.01
repeat_normal_tolerance_deg: 2.0
min_reference_points: 3
min_repeat_captures: 2
repeat_region_separation_m: 0.05

# Automatic active mode: full calibrated RGB field; height/depth/cluster filters still apply.
# May be narrowed to [x0, y0, x1, y1] for this fixed camera without a runtime prompt.
automatic_workspace_roi: full_valid_camera

# Retain clusters whose 5th-percentile signed table height is at most 5 cm; select the largest.
automatic_table_lower_height_m: 0.05
